<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>flip card</title>
<script>
(function(){try{
if(!('IntersectionObserver' in window))return;
var io=new IntersectionObserver(function(es){
  var v=es[0]&&es[0].isIntersecting;
  document.documentElement.classList.toggle('mk-off',!v);
},{threshold:0});
io.observe(document.documentElement);
}catch(e){}})();
</script>
<style>
.mk-off *{animation-play-state:paused !important}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:transparent}
body{display:flex;justify-content:center;align-items:center;-webkit-tap-highlight-color:transparent}
@media (prefers-reduced-motion: no-preference){
.float{animation:bob 6s ease-in-out infinite;will-change:transform}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
}
.flip-card{background:transparent;width:min(370px, 92vw, calc(94vh * 0.7048));aspect-ratio:74 / 105;perspective:1100px;cursor:pointer;position:relative;will-change:transform;touch-action:manipulation;transition:transform .5s cubic-bezier(.2,.8,.3,1.1)}
.sh-rest,.sh-hover{content:"";position:absolute;left:6%;right:6%;top:10%;bottom:2%;border-radius:24px;pointer-events:none;z-index:0;transition:opacity .5s ease}
.sh-rest{box-shadow:0 20px 28px rgba(0,0,0,.27);opacity:1}
.sh-hover{box-shadow:0 38px 48px rgba(0,0,0,.33);opacity:0}
.flip-card:hover .sh-rest{opacity:0}
.flip-card:hover .sh-hover{opacity:1}
.flip-inner{position:relative;width:100%;height:100%;text-align:center;will-change:transform;transition:transform .85s cubic-bezier(.25,.9,.3,1.06);transform-style:preserve-3d;z-index:1}
@media (hover:hover){
.flip-card:hover{transform:translateY(-8px) scale(1.03)}
.flip-card:hover .flip-inner{transform:rotateY(180deg)}
}
.flip-card.tflip .flip-inner,.flip-card.clicked .flip-inner{transform:rotateY(180deg)}
.float.mk-editing{animation:none!important}
.flip-card.mk-editing{cursor:default;transform:none!important}
.flip-card.mk-editing .flip-inner{transition:none!important}
.flip-card.mk-edit-front .flip-inner{transform:rotateY(0deg)!important}
.flip-card.mk-edit-back .flip-inner{transform:rotateY(180deg)!important}
.flip-card.mk-editing .fshine{display:none}
.face-f,.face-b{position:absolute;width:100%;height:100%;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:20px;overflow:hidden;background:#fff}
.face-b{transform:rotateY(180deg)}
img{width:100%;height:100%;display:block;object-fit:cover}
.fshine{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.30) 50%,transparent 60%);transform:translateX(-130%);transition:transform 1.1s ease;will-change:transform}
.flip-shine-mask{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:3}
@media (hover:hover){.flip-card:hover .fshine{transform:translateX(130%)}}
.flip-card.tflip .fshine,.flip-card.clicked .fshine{transform:translateX(130%)}
</style>
<style>.mk-key-focus:focus-visible{outline:3px solid #ffd66b!important;outline-offset:4px!important}</style>
<style>
#mk-common-decor{position:fixed;inset:0;width:100vw;height:100vh;z-index:2147483646;pointer-events:none!important;overflow:hidden;contain:layout style;transform:none}
#mk-common-decor img{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none!important;user-select:none}
</style>
</head>
<body>
<div class="float"><div class="flip-card" id="fc">
  <div class="sh-rest"></div><div class="sh-hover"></div>
  <div class="flip-inner">
    <div class="face-f" data-mk-adjust-box="front"><img src="./1.webp" alt=""><div class="fshine"></div></div>
    <div class="face-b" data-mk-adjust-box="back"><img src="./2.webp" alt=""><div class="fshine"></div></div>
  </div>
</div></div>
<script>
(function(){
function sparks(host,n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var colors=["#ffd97a","#ffe9b0","#ffc65c","#fff3d6"];
  for(var i=0;i<n;i++){
    var s=document.createElement("span");
    s.textContent=Math.random()<.55?"\u2726":"\u25CF";
    s.style.cssText="position:absolute;left:50%;top:50%;z-index:40;pointer-events:none;"
      +"font:700 "+(9+Math.random()*13)+"px sans-serif;color:"+colors[i%4]+";"
      +"text-shadow:0 0 6px rgba(255,215,130,.8);transform:translate(-50%,-50%);will-change:transform,opacity";
    host.appendChild(s);
    var a=Math.random()*Math.PI*2,d=80+Math.random()*150;
    var dx=Math.cos(a)*d,dy=Math.sin(a)*d-30;
    s.animate([
      {transform:"translate(-50%,-50%) scale(.4) rotate(0deg)",opacity:1},
      {transform:"translate(calc(-50% + "+dx+"px), calc(-50% + "+dy+"px)) scale(1.15) rotate("+(Math.random()*260-130)+"deg)",opacity:0}
    ],{duration:650+Math.random()*400,easing:"cubic-bezier(.15,.75,.4,1)"})
    .onfinish=(function(el){return function(){el.remove();};})(s);
  }
}
var fc=document.getElementById('fc');
var hasPang=false;
var lastT=0;
fc.addEventListener('touchstart',function(){lastT=Date.now();},{passive:true});
fc.addEventListener('click',function(){
  if(Date.now()-lastT<800){
    if(!fc.classList.contains('tflip')){fc.classList.add('tflip');return;}
    if(hasPang&&!fc.classList.contains('clicked')){fc.classList.add('clicked');sparks(fc,14);return;}
    fc.classList.remove('clicked');fc.classList.remove('tflip');
    return;
  }
  if(!hasPang)return;
  var on=fc.classList.toggle('clicked');
  if(on)sparks(fc,14);
});
})();
</script>
<script>
(function(){
var nodes=[].slice.call(document.querySelectorAll("#fc"));
nodes.forEach(function(el){el.tabIndex=0;el.setAttribute("role","button");el.setAttribute("aria-label","카드 뒤집기");el.classList.add("mk-key-focus");
el.addEventListener("keydown",function(e){if(e.key!=="Enter"&&e.key!==" ")return;e.preventDefault();el.click();});});
})();
</script>
